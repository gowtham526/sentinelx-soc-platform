name: E2E and Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit (Python SAST)
        run: pip install bandit && bandit -r . -f json -o sast-report.json || true
      - name: Run Trivy (Dependencies)
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.49.1 && trivy fs . --format table -o trivy-report.txt || true
      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            sast-report.json
            trivy-report.txt
            Vulnerability Test Results/

  e2e-selenium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
      - name: Install Selenium
        run: npm install selenium-webdriver
      - name: Run Selenium Tests
        run: node selenium-tests/tests/login-tests.js || true
      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium-tests/*.xlsx

  e2e-appium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
      - name: Run Appium Tests
        run: echo "Appium test mock run"
      - name: Upload Appium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-results
          path: appium-tests/*.xlsx

  load-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 Load Test
        run: echo "k6 run load-test.js"
      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-report.html
